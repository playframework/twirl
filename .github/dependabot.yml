version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "gradle-twirl"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "gradle-twirl"
    schedule:
      interval: "weekly"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[2.0.x] "
    # Keep the Gradle build compatible with Java 11.
    ignore:
      - dependency-name: "gradle-wrapper"
        versions: ["[9.0,)"]
      - dependency-name: "com.gradle.plugin-publish"
        versions: ["[2.2,)"]
  - package-ecosystem: "maven"
    directory: "maven-twirl"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "maven-twirl"
    schedule:
      interval: "weekly"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[2.0.x] "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[2.0.x] "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "1.6.x"
    commit-message:
      prefix: "[1.6.x] "
